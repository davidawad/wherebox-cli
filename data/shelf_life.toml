# Built-in shelf-life types (docs/SPEC.md, "Shelf life and on hand").
#
# One table per type. Keys:
#   group     fruit, vegetable, herb, dairy, egg, meat, seafood, bakery,
#             prepared, condiment, other
#   pantry, fridge, freezer
#             how long it keeps there (d, w, m, y; a range such as "3-5d"
#             uses its shorter end). Absent: not recommended there.
#   opened    how long it keeps after opening, wherever it is kept. Absent:
#             opening changes nothing.
#   synonyms  other names an item may carry (matched like the type name:
#             the phrase's head noun must be the head noun of the item name).
#
# Values are the conservative (shorter) end of the cited ranges. Override or
# extend them with `[shelf_life.<type>]` tables in config.toml, or
# `wherebox shelf-life set <type> --fridge 7d`.
#
# Sources:
#   [FK]  USDA FSIS FoodKeeper data, version 128 (2018),
#         https://catalog.data.gov/dataset/fsis-foodkeeper-data
#   [CSC] FoodSafety.gov / USDA "Cold Food Storage Chart" (the FDA
#         refrigerator and freezer storage chart),
#         https://www.foodsafety.gov/food-safety-charts/cold-food-storage-charts

# ---------------------------------------------------------------------------
