# / 3-4 months; chicken and turkey whole (#113-114) 1-2 days / 12 months,
# parts (#116-121) 9 months. [CSC] Fresh beef, veal, lamb, pork 3-5 days / 4-12
# months; ground meats 1-2 days / 3-4 months; poultry 1-2 days / 9 months
# (pieces); sausage raw 1-2 days / 1-2 months; bacon 7 days / 1 month; hot
# dogs and lunch meat 2 weeks unopened, 1 week (hot dogs) or 3-5 days
# (lunch meat) opened / 1-2 months; ham, fully cooked slices 3-4 days / 1-2
# months.
# ---------------------------------------------------------------------------

