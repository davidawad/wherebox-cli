# Receipt parsing data (docs/SPEC.md, "Receipts").
#
# abbreviations  receipt-speak expanded word by word before matching
#                ("ORG BNLS CHKN BRST" -> "organic boneless chicken breast").
#                Keys are lower case, one word; values any text.
# fee_words      lines that are not purchases (bags, deposits): left out.
# discount_words lines that take money off the item above.
# [[chain]]      chain profiles: how one chain's receipts read. A chain is
#                detected when one of its `detect` phrases is in the header
#                (whole words, any case). `generic` is the fallback.
#
# Chain fields:
#   name               the chain, as stored on stores (`store add --chain`)
#   detect             header phrases
#   sku_digits         digit-run lengths that are the chain's own item codes
#   date_order         "mdy" (default) or "dmy" for numeric dates
#   final_price_words  lines whose amount is the item above's final price
#   discount_words     extra discount words
#   fee_words          extra fee words
#   abbreviations      extra abbreviations, over the shared table

fee_words = [
    "bag", "bags", "bag fee", "paper bag", "plastic bag", "reusable bag", "bag credit", "bag tax",
    "bottle deposit", "deposit", "crv", "container deposit", "bottle dep", "btl dep",
]

discount_words = [
    "coupon", "cpn", "discount", "disc", "savings", "instant savings", "promo", "mfr", "member",
    "digital coupon", "off", "markdown",
]

