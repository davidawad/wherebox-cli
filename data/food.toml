# Food lexicon for recipe matching (docs/SPEC.md, "Lists and matching").
#
# nouns      words that name food when they are the head noun of a product
#            name ("Walnuts", "Hemp Seed Organic"); shelf-life type names and
#            synonyms, and the keys below, count too.
# synonyms   an entry naming the key also matches items named by any of the
#            values ("berries" is had by "Frozen Wild Blueberries"). A
#            shelf-life type's name works the same way with its synonyms.
# density    grams per millilitre, so volume entries (1 tbsp) count against
#            items sold by weight (a 12 oz bag) and the other way round.
# pieces     grams per piece, by unit ("ea" is one of the food), so count
#            entries (1 clove, 2 limes, 10 cherries) count against items sold
#            by weight or by the head.
#
# Densities and piece weights are rounded from USDA FoodData Central
# portion weights (SR Legacy household measures, e.g. "1 tbsp", "1 cup",
# "1 clove", "1 fruit"), https://fdc.nal.usda.gov/. An unknown density or
# piece weight leaves the entry a unit mismatch: unknown, not missing.

