# Mirror master and tags to GitLab (git@gitlab.com:davidawad/wherebox-cli.git)
# when the GITLAB_MIRROR_SSH_KEY secret (a private deploy key with write
# access on the GitLab project) is set; skipped otherwise.
name: Mirror to GitLab

on:
  push:
    branches: [master]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

env:
  GITLAB_REMOTE: git@gitlab.com:davidawad/wherebox-cli.git

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the deploy key
        id: key
        env:
          SSH_KEY: ${{ secrets.GITLAB_MIRROR_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::notice::GITLAB_MIRROR_SSH_KEY is not set; skipping the GitLab mirror."
            exit 0
          fi
          echo "present=true" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.key.outputs.present
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push master and tags
        if: steps.key.outputs.present
        env:
          SSH_KEY: ${{ secrets.GITLAB_MIRROR_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/gitlab_mirror
          chmod 600 ~/.ssh/gitlab_mirror
          # gitlab.com ED25519 host key, SHA256:eUXGGm1YGsMAS7vkcx6JOJdOGHPem5gQp4taiCfCLB8
          echo "gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf" >~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/gitlab_mirror -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git push "$GITLAB_REMOTE" refs/remotes/origin/master:refs/heads/master
          git push "$GITLAB_REMOTE" --tags
