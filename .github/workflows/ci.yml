# Default CI: fmt, clippy -D warnings and tests on Linux and macOS.
#
# Toolchains follow docs/platforms.md: fsqlite 0.4 needs nightly on x86_64
# (ubuntu-latest), while Apple Silicon (macos-latest) builds on stable.
# RUSTUP_TOOLCHAIN overrides rust-toolchain.toml per job. The remaining targets
# (aarch64 Linux, Intel macOS, Windows) run in ci-full.yml, by hand
# (`gh workflow run ci-full.yml`), on version tags and weekly.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # x86_64
            toolchain: nightly
          - os: macos-latest # Apple Silicon
            toolchain: stable
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ matrix.toolchain }}
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast
