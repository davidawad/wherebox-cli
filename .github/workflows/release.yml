# Tag-driven release (`just release <version>` pushes the tag; see
# docs/releasing.md). On a v* tag:
#   1. check:    the tag must equal v<Cargo.toml version>.
#   2. build:    each target builds natively with the toolchain it needs
#                (nightly on x86_64 and Windows, stable on aarch64; see
#                docs/platforms.md) and is packaged by scripts/package.sh as
#                wherebox-<version>-<target>.tar.gz (.zip on Windows) with the
#                binary, LICENSE, README.md, man pages and shell completions.
#   3. release:  SHA256SUMS, notes from conventional commits since the
#                previous tag (git-cliff, cliff.toml), GitHub release.
#   4. homebrew: updates Formula/wherebox.rb in <owner>/homebrew-tap (or
#                <owner>/tap) when the HOMEBREW_TAP_TOKEN secret is set;
#                skipped with a notice otherwise.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches Cargo.toml version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error file=Cargo.toml::tag $TAG does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 images keep the glibc requirement low (2.35).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            toolchain: nightly
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            toolchain: stable
          - target: aarch64-apple-darwin
            os: macos-latest
            toolchain: stable
          - target: x86_64-apple-darwin
            os: macos-15-intel
            toolchain: nightly
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            toolchain: nightly
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Rust ${{ matrix.toolchain }}
        shell: bash
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: scripts/package.sh "$VERSION" ${{ matrix.target }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags: the notes cover commits since the previous tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Release notes
        run: |
          git cliff --current --strip all --output notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          sha256sum -- *.tar.gz *.zip | tee SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS

  homebrew:
    needs: [check, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Find the tap
        id: tap
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap update."
            exit 0
          fi
          for repo in "$OWNER/homebrew-tap" "$OWNER/tap"; do
            if gh api "repos/$repo" >/dev/null 2>&1; then
              echo "repo=$repo" >>"$GITHUB_OUTPUT"
              echo "Updating $repo"
              exit 0
            fi
          done
          echo "::notice::Neither $OWNER/homebrew-tap nor $OWNER/tap exists (or the token cannot read it); skipping the Homebrew tap update."
      - uses: actions/checkout@v4
        if: steps.tap.outputs.repo
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        if: steps.tap.outputs.repo
        with:
          name: SHA256SUMS
      - uses: actions/checkout@v4
        if: steps.tap.outputs.repo
        with:
          repository: ${{ steps.tap.outputs.repo }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update Formula/wherebox.rb
        if: steps.tap.outputs.repo
        run: |
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "$VERSION" SHA256SUMS "$GITHUB_REPOSITORY" >tap/Formula/wherebox.rb
          cat tap/Formula/wherebox.rb
          cd tap
          git add Formula/wherebox.rb
          if git diff --cached --quiet; then
            echo "Formula/wherebox.rb is already at $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "wherebox $VERSION"
          git push
