# Optional full matrix; the fast default is ci.yml.
# fmt, clippy and the full test suite on every supported platform.
#
# Toolchains: fsqlite 0.4 needs nightly on x86_64 and on Windows (see
# rust-toolchain.toml); aarch64 Linux and Apple Silicon run on stable to keep
# that path honest. RUSTUP_TOOLCHAIN overrides rust-toolchain.toml per job.
name: CI full matrix

on:
  # Optional: the slow cross-platform matrix. Push/PR runs ci.yml (one fast job).
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            toolchain: nightly
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            toolchain: stable
          - name: macos-arm64
            os: macos-latest
            toolchain: stable
          # GitHub retired the macos-13 image in December 2025; macos-15-intel
          # is the remaining x86_64 macOS runner.
          - name: macos-x86_64
            os: macos-15-intel
            toolchain: nightly
          - name: windows-x86_64
            os: windows-latest
            toolchain: nightly
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast
