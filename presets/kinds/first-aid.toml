# wherebox kind preset `first-aid`. Override it by copying this file to
# <config dir>/presets/kinds/first-aid.toml (see docs/presets.md).
name = "first-aid"
description = "First-aid kit supplies"
category = "consumable"
tracks = ["expiration"]
alert_days = 30
notes = "Not perishable: wherebox tracks no expiry for it (docs/SPEC.md, \"Shelf life\"). Keep a printed expiration date as a custom field: --field Expiration=2027-01-31."

[[sources]]
covers = "alert_days"
cite = "docs/SPEC.md (Presets table): wherebox policy, not an external fact"
