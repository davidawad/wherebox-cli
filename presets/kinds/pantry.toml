# wherebox kind preset `pantry`. Override it by copying this file to
# <config dir>/presets/kinds/pantry.toml (see docs/presets.md).
name = "pantry"
description = "Shelf-stable dry and canned goods"
category = "food"
tracks = ["opened_at", "par_level"]
notes = "Non-perishable: shelf-stable dry and canned goods never expire in wherebox (their printed dates are about quality); lots are presumed used up after the reorder cadence. An opened can or jar that now needs the fridge: --shelf-life canned-food-opened (or condiment-opened)."
