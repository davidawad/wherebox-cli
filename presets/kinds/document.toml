# wherebox kind preset `document`. Override it by copying this file to
# <config dir>/presets/kinds/document.toml (see docs/presets.md).
name = "document"
description = "Documents with an expiration: passport, license, insurance policy"
category = "document"
tracks = ["expiration"]
alert_days = 90
notes = "Not perishable: wherebox tracks no expiry for it (docs/SPEC.md, \"Shelf life\"). Keep a printed expiration date as a custom field: --field Expiration=2027-01-31."

[[sources]]
covers = "alert_days"
cite = "docs/SPEC.md (Presets table): wherebox policy, not an external fact"
