# wherebox kind preset `electronics`. Override it by copying this file to
# <config dir>/presets/kinds/electronics.toml (see docs/presets.md).
name = "electronics"
description = "Electronics: computers, phones, TVs, audio"
category = "durable"
tracks = ["warranty", "serial"]
alert_days = 90
notes = "Warranty terms vary by product; enter --warranty-expires from the receipt."

[[sources]]
covers = "alert_days (warranty alert; matches `report warranties --expiring 90d`)"
cite = "docs/SPEC.md (Presets table): wherebox policy, not an external fact"
