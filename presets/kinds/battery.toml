# wherebox kind preset `battery`. Override it by copying this file to
# <config dir>/presets/kinds/battery.toml (see docs/presets.md).
name = "battery"
description = "Batteries (spares)"
category = "consumable"
tracks = ["expiration"]
notes = "Not perishable: wherebox tracks no expiry for it (docs/SPEC.md, \"Shelf life\"). Keep a printed expiration date as a custom field: --field Expiration=2027-01-31."
