# wherebox kind preset `condiment`. Override it by copying this file to
# <config dir>/presets/kinds/condiment.toml (see docs/presets.md).
name = "condiment"
description = "Sauces and condiments: ketchup, mustard, mayonnaise, dressings"
category = "food"
tracks = ["best_by", "opened_at"]
notes = "Unopened shelf life (mayonnaise 3-6 months up to mustard 1-2 years); opened mayonnaise keeps 2 months refrigerated."

[shelf_life]
date = "best_by"
pantry = "3-24m"

[[sources]]
covers = "pantry"
cite = "USDA FSIS FoodKeeper data, version 128 (2018): Mayonnaise (#350): 3-6 months; Ketchup (#348): 1 year; Salad dressings (#356): 10-12 months; Mustard (#351): 1-2 years (unopened)"
url = "https://catalog.data.gov/dataset/fsis-foodkeeper-data"

[[sources]]
covers = "notes"
cite = "USDA FSIS Cold Food Storage Chart (FoodSafety.gov): commercial mayonnaise, refrigerate after opening, 2 months"
url = "https://www.foodsafety.gov/food-safety-charts/cold-food-storage-charts"
