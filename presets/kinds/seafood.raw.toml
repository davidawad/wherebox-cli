# wherebox kind preset `seafood.raw`. Override it by copying this file to
# <config dir>/presets/kinds/seafood.raw.toml (see docs/presets.md).
name = "seafood.raw"
description = "Raw fish and shellfish"
category = "food"
tracks = ["use_by", "frozen_at"]
notes = "Freezer life by fish: fatty (salmon, tuna, mackerel) 2-3 months, lean (cod, halibut) 6-8 months; the shortest applies by default."

[shelf_life]
date = "use_by"
fridge = "1-2d"
freezer = "2-8m"

[[sources]]
covers = "fridge, freezer"
cite = "USDA FSIS FoodKeeper data, version 128 (2018): Lean fish (#144): refrigerate 1-2 days, freeze 6-8 months; Fatty fish (#146): 1-2 days, 2-3 months; Shrimp, scallops, squid (#150-152): 1-3 days, 6-18 months"
url = "https://catalog.data.gov/dataset/fsis-foodkeeper-data"
