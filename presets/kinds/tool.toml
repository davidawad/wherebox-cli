# wherebox kind preset `tool`. Override it by copying this file to
# <config dir>/presets/kinds/tool.toml (see docs/presets.md).
name = "tool"
description = "Power and hand tools"
category = "durable"
tracks = ["warranty", "serial", "service"]
alert_days = 90
notes = "Warranty terms vary by product; enter --warranty-expires from the receipt."

[[sources]]
covers = "alert_days (warranty alert; matches `report warranties --expiring 90d`)"
cite = "docs/SPEC.md (Presets table): wherebox policy, not an external fact"
