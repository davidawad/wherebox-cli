# wherebox built-in shelf-life types (docs/SPEC.md, "Shelf life").
#
# One table per type: `[<type>]` with
#   group       fruit, vegetable, dairy, eggs, meat, poultry, seafood, bakery,
#               prepared, opened
#   description what it covers
#   pantry, fridge, freezer   how long it keeps stored there (5d, 2w, 6m, 1y);
#               absent = storing it there is not recommended
#   opened      how long it keeps once opened (replaces the storage figure)
#   synonyms    other names, for classifying items by name
#   not         words that rule a name out (`peanut butter` is not butter)
#
# Figures are conservative: the short end of every published range, from
# purchase (or freezing, or opening). Override or extend any type in
# config.toml with a `[shelf_life.<type>]` table (`wherebox shelf-life set`).

# --- Fruit ------------------------------------------------------------------
